<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tes Minat RIASEC & Gaya Belajar VAK</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 12px; border: none; }
    .badge-code { font-size: 0.9em; padding: 4px 8px; border-radius: 4px; }
    @media print {
      .no-print { display: none !important; }
      body { background-color: #fff; }
      .card { box-shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body class="py-4">

<div class="container" style="max-width: 850px;">
  <!-- FORM IDENTITAS SISWA -->
  <div id="sec-identitas" class="card shadow-sm p-4 mb-4">
    <h4 class="text-primary mb-3"><i class="bi bi-person-vcard"></i> Identitas Siswa</h4>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label font-weight-bold">Pilih Kelas</label>
        <select id="selKelas" class="form-select" onchange="loadSiswa(this.value)">
          <option value="">-- Memuat Kelas... --</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label font-weight-bold">Pilih Nama Siswa</label>
        <select id="selSiswa" class="form-select" disabled>
          <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary mt-4 w-100" onclick="mulaiTes()"><i class="bi bi-play-circle"></i> Mulai Tes</button>
  </div>

  <!-- CONTAINER TES -->
  <div id="sec-tes" class="card shadow-sm p-4 mb-4 d-none">
    <h4 class="text-primary mb-3" id="tes-title">Instrumen Tes</h4>
    <div id="question-container"></div>
    <div class="d-flex justify-content-between mt-4">
      <button id="btnPrev" class="btn btn-outline-secondary" onclick="prevQ()" disabled>Kembali</button>
      <button id="btnNext" class="btn btn-primary" onclick="nextQ()">Lanjut</button>
    </div>
  </div>

  <!-- HALAMAN HASIL LAPORAN -->
  <div id="sec-hasil" class="card shadow-sm p-4 mb-4 d-none">
    <div class="text-center mb-4">
      <i class="bi bi-award text-primary display-4"></i>
      <h3 class="fw-bold text-primary mt-2">Laporan Hasil Minat RIASEC & Gaya Belajar VAK</h3>
      <p class="text-muted">Hasil Evaluasi Minat, Bakat, dan Rekomendasi Strategi Belajar Siswa</p>
    </div>

    <!-- Ringkasan Identitas -->
    <table class="table table-bordered align-middle">
      <tr>
        <th width="30%">Nama Siswa</th>
        <td id="res-nama" class="fw-bold"></td>
      </tr>
      <tr>
        <th>Kelas</th>
        <td id="res-kelas"></td>
      </tr>
      <tr>
        <th>Minat Dominan (RIASEC)</th>
        <td><span id="res-riasec" class="badge bg-primary fs-6"></span></td>
      </tr>
      <tr>
        <th>Gaya Belajar (VAK)</th>
        <td><span id="res-vak" class="badge bg-success fs-6"></span></td>
      </tr>
    </table>

    <!-- Detail Skor -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="p-3 border rounded bg-light">
          <h6>Skor Dimensi RIASEC</h6>
          <div id="skor-riasec-detail" class="small"></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="p-3 border rounded bg-light">
          <h6>Skor Dimensi VAK</h6>
          <div id="skor-vak-detail" class="small"></div>
        </div>
      </div>
    </div>

    <!-- TOMBOL AKSI -->
    <div class="d-flex flex-wrap gap-2 mt-3 no-print">
      <button class="btn btn-danger flex-fill py-2" onclick="window.print()">
        <i class="bi bi-printer"></i> Cetak / Simpan PDF
      </button>
      
      <button id="btnKirimDrive" class="btn btn-primary flex-fill py-2" onclick="kirimKeDrive()">
        <i class="bi bi-cloud-upload"></i> Kirim ke Kurikulum
      </button>

      <button class="btn btn-secondary py-2" onclick="location.reload()">
        <i class="bi bi-arrow-counterclockwise"></i> Pengisian Baru
      </button>
    </div>
  </div>
</div>

<script>
  // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT KAMU
  const API_URL = "https://script.google.com/macros/s/AKfycbzxR8_QCBaRftEVKx6R3c4jeHDWPahkgp4ErD9hLpDE3SSDjmlFq2nN7q1sWUVZyhxvmQ/exec";

  let state = { nama: '', kelas: '' };
  let hasilGlobal = null;

  // Inisialisasi awal
  window.onload = function() {
    fetch(API_URL + '?action=getKelas')
      .then(r => r.json())
      .then(data => {
        let opt = '<option value="">-- Pilih Kelas --</option>';
        data.forEach(k => opt += `<option value="${k}">${k}</option>`);
        document.getElementById('selKelas').innerHTML = opt;
      });
  };

  function loadSiswa(kelas) {
    if(!kelas) return;
    const selSiswa = document.getElementById('selSiswa');
    selSiswa.disabled = true;
    selSiswa.innerHTML = '<option value="">-- Memuat Siswa... --</option>';
    
    fetch(API_URL + `?action=getSiswa&kelas=${encodeURIComponent(kelas)}`)
      .then(r => r.json())
      .then(data => {
        let opt = '<option value="">-- Pilih Nama --</option>';
        data.forEach(s => opt += `<option value="${s}">${s}</option>`);
        selSiswa.innerHTML = opt;
        selSiswa.disabled = false;
      });
  }

  function mulaiTes() {
    state.kelas = document.getElementById('selKelas').value;
    state.nama = document.getElementById('selSiswa').value;

    if(!state.kelas || !state.nama) {
      alert('Silakan pilih Kelas dan Nama Siswa terlebih dahulu!');
      return;
    }

    // Contoh data hasil simulasikan (Integrasikan dengan logika perhitungan tes kamu)
    hasilGlobal = {
      action: 'savePdfDrive',
      nama: state.nama,
      kelas: state.kelas,
      kodeDominanRIASEC: 'R-E',
      kodeDominanVAK: 'K',
      skorRIASEC: { R: 4, I: 2, A: 1, S: 1, E: 2, C: 0 },
      skorVAK: { V: 1, A: 2, K: 5 }
    };

    tampilkanHasil();
  }

  function tampilkanHasil() {
    document.getElementById('sec-identitas').classList.add('d-none');
    document.getElementById('sec-hasil').classList.remove('d-none');

    document.getElementById('res-nama').innerText = hasilGlobal.nama;
    document.getElementById('res-kelas').innerText = hasilGlobal.kelas;
    document.getElementById('res-riasec').innerText = hasilGlobal.kodeDominanRIASEC;
    document.getElementById('res-vak').innerText = hasilGlobal.kodeDominanVAK;

    // Render detail skor
    document.getElementById('skor-riasec-detail').innerHTML = 
      `R: ${hasilGlobal.skorRIASEC.R} | I: ${hasilGlobal.skorRIASEC.I} | A: ${hasilGlobal.skorRIASEC.A} | ` +
      `S: ${hasilGlobal.skorRIASEC.S} | E: ${hasilGlobal.skorRIASEC.E} | C: ${hasilGlobal.skorRIASEC.C}`;

    document.getElementById('skor-vak-detail').innerHTML = 
      `Visual: ${hasilGlobal.skorVAK.V} | Auditori: ${hasilGlobal.skorVAK.A} | Kinestetik: ${hasilGlobal.skorVAK.K}`;
    
    // Kirim data mentah ke Google Sheets secara background saat hasil muncul
    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        kelas: hasilGlobal.kelas,
        nama: hasilGlobal.nama,
        kodeDominanRIASEC: hasilGlobal.kodeDominanRIASEC,
        kodeDominanVAK: hasilGlobal.kodeDominanVAK,
        skorRIASEC: hasilGlobal.skorRIASEC,
        skorVAK: hasilGlobal.skorVAK
      })
    });
  }

  function kirimKeDrive() {
    const btn = document.getElementById('btnKirimDrive');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Mengirim...';

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(hasilGlobal)
    })
    .then(res => res.json())
    .then(res => {
      if(res.status === 'success') {
        alert('Berhasil! File PDF laporan telah disimpan di Google Drive Kurikulum.');
        btn.className = 'btn btn-success flex-fill py-2';
        btn.innerHTML = '<i class="bi bi-check-circle"></i> Terkirim ke Drive!';
      } else {
        alert('Gagal mengirim file: ' + res.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-cloud-upload"></i> Kirim ke Kurikulum';
      }
    })
    .catch(err => {
      alert('Terjadi kesalahan koneksi.');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-cloud-upload"></i> Kirim ke Kurikulum';
    });
  }
</script>
</body>
</html>
